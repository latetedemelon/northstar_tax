<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ brand.name }}</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto;
             padding: 0 1rem; color: #1a1a1a; line-height: 1.5; }
      h1 { margin-bottom: 0.2rem; } .tagline { color: #555; margin-top: 0; }
      form { display: grid; gap: 0.6rem; margin: 1.5rem 0; }
      label { display: grid; gap: 0.2rem; font-size: 0.9rem; }
      input { padding: 0.4rem; font-size: 1rem; }
      button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; width: max-content; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      td, th { border-bottom: 1px solid #e2e2e2; padding: 0.35rem 0.5rem; text-align: left; }
      .amt { text-align: right; font-variant-numeric: tabular-nums; }
      .bottom { font-size: 1.3rem; font-weight: 600; }
      .refund { color: #117a3d; } .owing { color: #b3261e; }
      .note { background: #fff8e1; padding: 0.5rem 0.75rem; border-radius: 4px; }
      .error { color: #b3261e; } footer { color: #777; font-size: 0.85rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <h1>{{ brand.name }}</h1>
    <p class="tagline">{{ brand.tagline }}</p>
    {% block content %}{% endblock %}
    <footer>{{ brand.footer }} — prepared, never filed. You review it and file it yourself.</footer>
  </body>
</html>
