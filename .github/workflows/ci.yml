name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: setup python
        run: uv python install 3.11

      - name: install deps
        run: uv sync --all-extras --dev

      - name: lint (ruff)
        run: uv run ruff check .

      - name: format check (ruff)
        run: uv run ruff format --check .

      - name: typecheck (mypy)
        run: uv run mypy

      - name: validate tax constants
        run: uv run python scripts/validate_constants.py

      - name: tests
        run: uv run pytest
